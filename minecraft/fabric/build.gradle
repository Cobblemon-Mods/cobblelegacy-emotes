import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "com.gradleup.shadow"
    id "com.modrinth.minotaur"
    id "org.jetbrains.kotlin.jvm"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.compose"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

repositories {
    google()
    maven {
        url "https://jitpack.io"
        content { includeGroup("com.github.apersomany") }
    }
}

loom {
    accessWidenerPath = project(":minecraft:archCommon").loom.accessWidenerPath
}

configurations {
    compileModule
    common
    commonModule

    common.extendsFrom commonModule
    compileModule.extendsFrom commonModule

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"

    // Fabric API
    modImplementation(fabricApi.module("fabric-command-api-v2", rootProject.fabric_api_version))
    modImplementation(fabricApi.module("fabric-networking-api-v1", rootProject.fabric_api_version))
    modImplementation(fabricApi.module("fabric-key-binding-api-v1", rootProject.fabric_api_version))
    modImplementation(fabricApi.module("fabric-lifecycle-events-v1", rootProject.fabric_api_version))

    commonModule(project(':executor')) {transitive false}
    commonModule(project(':emotesAPI')) {transitive false}
    commonModule(project(':emotesServer')) {transitive false}
    commonModule(project(':emotesAssets')) {transitive false}

    modRuntimeOnly(fabricApi.module("fabric-screen-api-v1", rootProject.fabric_api_version))
    modImplementation("com.terraformersmc:modmenu:${rootProject.modmenu_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

    include modImplementation("io.github.kosmx.bendy-lib:bendy-lib-fabric:${rootProject.bendylib_version}")
    include modImplementation("dev.kosmx.player-anim:player-animation-lib-fabric:${rootProject.player_animator_version}")

    common(project(path: ":minecraft:archCommon", configuration: "namedElements")) { transitive false }
    compileModule(project(path: ":minecraft:archCommon", configuration: "transformProductionFabric")) { transitive false }

    // ─── CobbleLegacy : boutique, roue et collection d'émotes ───────────────────
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${rootProject.fabric_kotlin_version}"

    // Compose : compilation seulement, Composite (cobblelegacy-libs) fournit les classes en jeu.
    implementation(compose.runtime)
    implementation(compose.foundation)
    implementation(compose.material3)
    implementation(compose.materialIconsExtended)
    implementation(compose.ui)
    modCompileOnly "com.github.apersomany:composite:5c27c6a"
    // En développement : la vraie cobblelegacy-libs (fork de Composite), sinon la version JitPack.
    def localComposite = file("D:/CobbleLegacy/cobblelegacy_composite/build/libs/cobblelegacy-libs.jar")
    if (localComposite.exists()) {
        modLocalRuntime files(localComposite)
    } else {
        modLocalRuntime "com.github.apersomany:composite:5c27c6a"
    }
    // Autotest : le dernier Pokématos buildé à côté, pour vérifier son onglet « Émotes » (développement seulement).
    def localPokematos = fileTree("D:/CobbleLegacy/cobblelegacy-pokematos/build/libs") {
        include "cobblelegacy-pokematos-*.jar"
        exclude "*-sources.jar"
    }.files.sort { -it.lastModified() }.find()
    if (localPokematos != null) {
        modLocalRuntime files(localPokematos)
        // Ses bibliothèques jar-in-jar ne sont pas chargées en développement.
        localRuntime "redis.clients:jedis:5.1.0"
    }

    // Base MariaDB partagée par les serveurs (catalogue, émotes possédées), comme les capes.
    include(implementation("com.zaxxer:HikariCP:5.1.0"))
    include(implementation("org.mariadb.jdbc:mariadb-java-client:3.4.1"))
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

// ─── Autotest en jeu ───────────────────────────────────────────────────────────
// `./gradlew :minecraft:fabric:runSelftest` lance le client, crée un monde plat, importe les émotes de
// test, règle le catalogue, joue, achète, bloque, ouvre la roue, la collection, la boutique (aussi
// dans le Pokématos s'il est buildé à côté) et l'éditeur, enregistre des captures dans
// run/screenshots/selftest-*.png puis quitte. Ni ce code ni ses fichiers n'entrent dans le jar du mod.
sourceSets {
    selftest {
        kotlin.srcDir 'src/selftest/kotlin'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

kotlin.target.compilations.selftest.associateWith(kotlin.target.compilations.main)

loom {
    runs {
        selftest {
            client()
            configName = "Emotes self-test"
            source sourceSets.selftest
            vmArg "-Dcobblelegacy.emotes.selftest=true"
            vmArg "-Dcobblelegacy.emotes.testEconomy=100000"
            programArgs "--width", "1280", "--height", "720", "--username", "Danseur"
            runDir "run"
            ideConfigGenerated false
        }
    }
}


processResources {
    inputs.property "version", project.version
    inputs.property "description", rootProject.mod_description

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "description": rootProject.mod_description
    }
}


// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
// if it is present.
// If you remove this task, sources will not be generated.

shadowJar{
    configurations = [project.configurations.compileModule]
    archiveClassifier.set("fabric-dev")
}

remapJar{
    injectAccessWidener = true
    inputFile.set shadowJar.archiveFile
    archiveClassifier.set("fabric")
    // Le jar livré (serveurs, launcher, libs-api du Pokématos) remplace emotecraft-for-MC1.21.1-2.4.12-fabric.jar.
    archiveFileName.set("cobblelegacy-emotes-${rootProject.cobblelegacy_version}.jar")
}

jar {
    archiveClassifier.set("dev")
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}


// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            // add all the jars that should be included when publishing to maven
            artifact(jar) {
                builtBy remapJar
            }
            //artifact("${project.buildDir.absolutePath}/libs/${archivesBaseName}-${project.version}.jar"){
            //	builtBy remapJar
            //}
            artifact(remapJar) {
                builtBy remapJar
            }
        }
    }

    // select the repositories you want to publish to
    repositories {
        // uncomment to publish to the local maven
        mavenLocal()
    }
}

if (keysExists) {
    modrinth {
        versionType = project.cfType

        uploadFile = remapJar

        token = project.keys.modrinth_token
        // Get the GitHub Access Token you got from the basics part of this tutorial.
        projectId = "pZ2wrerK" // Enter your modrinth mod ID here.
        //System.out.println("Enter the version number:");
        versionNumber = "${project.mod_version}+${project.minecraft_version}-fabric"
        versionName = "${project.mod_version}"

        gameVersions = ["1.21.1"]
        changelog = changes
        loaders = ["fabric", "quilt"]
        failSilently = false

        dependencies {
            required.project "fabric-api"
            optional.project "modmenu"
            embedded.project "bendy-lib"
            embedded.project "playeranimator"
        }
    }
}
